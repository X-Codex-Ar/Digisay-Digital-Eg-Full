name: Publish container packages

on:
  workflow_call:
    inputs:
      version:
        description: Stable semantic version without the v prefix
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version without the v prefix
        required: true
        type: string
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.name }} image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: docker/api.Dockerfile
          - name: public
            dockerfile: docker/public.production.Dockerfile
          - name: dashboard
            dockerfile: docker/dashboard.production.Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Validate release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version || github.event.inputs.version }}
        run: |
          version="$INPUT_VERSION"
          if [[ -z "$version" && "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable SemVer version such as 1.2.3; received '$version'." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "major=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "minor=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ steps.version.outputs.major != '0' }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            DIGISAY_API_BASE_URL=${{ vars.DIGISAY_API_BASE_URL }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
