name: CI Quality Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-react:
    name: Public React
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: public
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          working-directory: public
          version: 12.14.0
          runtime: node@22.22.3
          cache: true
          cache-dependency-path: public/pnpm-lock.yaml
          install: false

      - name: Install from the public app lockfile
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm run test

      - name: Build production app
        run: pnpm run build

  angular-dashboard:
    name: Angular Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          working-directory: dashboard
          version: 12.14.0
          runtime: node@22.22.3
          cache: true
          cache-dependency-path: dashboard/pnpm-lock.yaml
          install: false

      - name: Install from the dashboard app lockfile
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test --watch=false

      - name: Build production app
        run: pnpm run build

  backend-dotnet:
    name: Backend .NET 10
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Str0ng_Test_Passw0rd!26
        ports:
          - 1433:1433
        options: >-
          --health-cmd "bash -c '</dev/tcp/127.0.0.1/1433'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_REDIS_CONNECTION_STRING: localhost:6379
      TEST_SQLSERVER_CONNECTION_STRING: Server=localhost,1433;Database=master;User Id=sa;Password=Str0ng_Test_Passw0rd!26;Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=True
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            backend/src/*/packages.lock.json
            backend/tests/*/packages.lock.json

      - name: Restore locked dependencies
        run: dotnet restore backend/DigiSay.sln --locked-mode

      - name: Build backend
        run: dotnet build backend/DigiSay.sln --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test backend/DigiSay.sln --configuration Release --no-build --no-restore
