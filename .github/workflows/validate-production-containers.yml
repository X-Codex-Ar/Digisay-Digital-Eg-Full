name: Validate production containers

on:
  pull_request:
    paths:
      - "docker/**"
      - "public/**"
      - "dashboard/**"
      - ".github/workflows/validate-production-containers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }} production image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: public
            dockerfile: docker/public.production.Dockerfile
          - name: dashboard
            dockerfile: docker/dashboard.production.Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          build-args: |
            DIGISAY_API_BASE_URL=https://api.validation.invalid
          cache-from: type=gha,scope=production-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=production-${{ matrix.name }}
