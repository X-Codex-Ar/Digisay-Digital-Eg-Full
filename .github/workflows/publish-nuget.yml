name: Publish NuGet packages

on:
  workflow_call:
    inputs:
      version:
        description: Stable semantic version without the v prefix
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version without the v prefix
        required: true
        type: string
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    name: Pack and publish .NET libraries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            backend/src/*/packages.lock.json

      - name: Restore locked dependencies
        run: dotnet restore backend/DigiSay.sln --locked-mode

      - name: Build libraries
        run: dotnet build backend/DigiSay.sln --configuration Release --no-restore -m:1

      - name: Determine package version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version || github.event.inputs.version }}
        run: |
          package_version="$INPUT_VERSION"
          if [[ -z "$package_version" && "$GITHUB_REF" == refs/tags/v* ]]; then
            package_version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable SemVer version such as 1.2.3; received '$package_version'." >&2
            exit 1
          fi
          echo "value=$package_version" >> "$GITHUB_OUTPUT"

      - name: Pack DigiSay libraries
        shell: bash
        run: |
          output="$RUNNER_TEMP/nuget-packages"
          mkdir -p "$output"
          for project in \
            backend/src/DigiSay.Domain/DigiSay.Domain.csproj \
            backend/src/DigiSay.Application/DigiSay.Application.csproj \
            backend/src/DigiSay.Infrastructure/DigiSay.Infrastructure.csproj; do
            dotnet pack "$project" \
              --configuration Release \
              --no-build \
              --no-restore \
              -m:1 \
              --output "$output" \
              -p:PackageVersion="${{ steps.version.outputs.value }}"
          done

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${GITHUB_OWNER,,}/index.json" \
            --name github \
            --username "$GITHUB_ACTOR" \
            --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text
          for package in "$RUNNER_TEMP"/nuget-packages/*.nupkg; do
            dotnet nuget push "$package" \
              --source github \
              --api-key "$GITHUB_TOKEN" \
              --skip-duplicate
          done
