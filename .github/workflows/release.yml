name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Create or update the release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-containers:
    name: Publish versioned container images
    needs: release
    if: needs.release.outputs.release_created == 'true'
    uses: ./.github/workflows/publish-containers.yml
    with:
      version: ${{ needs.release.outputs.version }}
    permissions:
      contents: read
      packages: write

  publish-nuget:
    name: Publish versioned NuGet packages
    needs: release
    if: needs.release.outputs.release_created == 'true'
    uses: ./.github/workflows/publish-nuget.yml
    with:
      version: ${{ needs.release.outputs.version }}
    permissions:
      contents: read
      packages: write
