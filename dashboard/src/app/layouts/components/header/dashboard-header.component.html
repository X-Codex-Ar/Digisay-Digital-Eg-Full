<header class="sticky top-0 z-30 flex min-h-[68px] items-center justify-between border-b border-border bg-card/90 px-4 sm:px-6 lg:px-8 backdrop-blur-xl">
  <div class="flex items-center gap-3 sm:gap-4">
    <!-- Sidebar Toggle / Collapse Button -->
    <button
      type="button"
      (click)="sidebar.toggle()"
      class="inline-flex size-10 items-center justify-center rounded-2xl border border-border/80 bg-card/70 text-foreground transition-colors hover:border-primary/40 hover:bg-card hover:text-primary focus-visible:ring-2 focus-visible:ring-ring cursor-pointer"
      aria-label="Toggle sidebar navigation"
    >
      <svg
        class="size-5 transition-transform duration-200"
        [class.rotate-180]="sidebar.isCollapsed()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect width="18" height="18" x="3" y="3" rx="2"/>
        <path d="M9 3v18"/>
        <path d="m14 9-3 3 3 3"/>
      </svg>
    </button>

    <div class="grid gap-0.5">
      <span class="text-[.62rem] font-bold tracking-[.12em] text-muted-foreground">{{ category() }}</span>
      <strong class="text-sm font-bold text-foreground">{{ title() }}</strong>
    </div>
  </div>

  <div class="flex items-center gap-3">
    <!-- Setup status badge -->
    <span class="hidden sm:flex items-center gap-2 rounded-full border border-border bg-background px-3 py-1.5 text-xs text-muted-foreground">
      <span class="status-dot"></span>{{ badge() }}
    </span>

    <!-- Theme Toggle Button matching Public Header -->
    <button
      type="button"
      (click)="theme.toggle()"
      class="inline-flex size-10 items-center justify-center rounded-2xl border border-border/80 bg-card/70 text-foreground shadow-sm transition-colors duration-200 hover:border-primary/40 hover:bg-card hover:text-primary focus-visible:ring-2 focus-visible:ring-ring cursor-pointer"
      [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
    >
      @if (theme.isDark()) {
        <svg class="size-4.5 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
        </svg>
      } @else {
        <svg class="size-4.5 text-amber-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
        </svg>
      }
    </button>
  </div>
</header>
